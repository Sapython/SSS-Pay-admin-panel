<app-header pageName="Dashboard"></app-header>
<section>
  <div id="cards">
    <div class="card" id="aeps-members-card">
      <h1>AEPS MEMBERS</h1>
      <p>608</p>
    </div>
    <div class="card" id="aeps-balance-card">
      <h1>AEPS BALANCE</h1>
      <p>₹90,00,000</p>
    </div>
  </div>
  <div>
    <h3>New Members</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Date of Birth</th>
            <th>Gender</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let member of newMembers; let i = index">
            <td>{{ i + 1 }}</td>
            <td class="photo-and-name">
              <img [src]="member.photoURL || 'assets/img/circle-user-solid.svg'" referrerpolicy="no-referrer" />
              {{ member?.displayName | titlecase }}
            </td>
            <td>{{ getDate(member?.dob) | date }}</td>
            <td>{{ member?.gender || 'not-specified' | titlecase }}</td>
            <td class="buttons">
              <a uk-tooltip="title: Call" href="tel:{{member.phoneNumber}}" class="primary-button">
                <i class="fa-solid fa-phone"></i>
              </a>
              <button (click)="editUser(member)" uk-tooltip="title: Edit User" class="primary-button"><i class="fa-solid fa-user-pen"></i></button>
              <button (click)="lockUser(member.userId)" uk-tooltip="title: Lock User" class="primary-button"><i class="fa-solid fa-user-lock"></i></button>
              <button (click)="removeUser(member.userId)" uk-tooltip="title: Remove User" class="primary-button"><i class="fa-solid fa-user-large-slash"></i></button>
              <button (click)="promoteUser(member.userId)" uk-tooltip="title: Promote User" class="primary-button"><i class="fa-solid fa-user-tag"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
