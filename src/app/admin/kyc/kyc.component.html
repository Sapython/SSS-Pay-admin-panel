<app-header pageName="KYC"></app-header>
<div>
  <p>Total requests: <b>{{kycRequests.length}}</b></p>
</div>
<ul>
  <li *ngFor="let kyc of kycRequests;let i = index;">
    <p>{{i+1}}. <b>{{kyc.name | titlecase}}</b> seeks KYC approval</p>
    <p [class]="kyc.status">{{kyc.status | titlecase}}</p>
    <button class="primary-button" (click)="openDetail(kyc)">View</button>
  </li>
</ul>
